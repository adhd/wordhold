name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out complete source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Verify release runner and compiler
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "14"
          test "$(bun --revision)" = "1.3.11+af24e281e"
          test "$(bun -e 'process.stdout.write(Bun.revision)')" = "af24e281ebacd6ac77c0f14b4206599cf4ae1c9f"
          test "$(shasum -a 256 "$(command -v bun)" | awk '{print $1}')" = "1d77af7bfd811aebb7d37bec496a5eed14fe227ded3ab7866d2f39786e8107b6"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit locked dependencies
        run: bun run audit:dependencies

      - name: Verify public source and history
        run: bun run verify:source

      - name: Test
        run: bun test

      - name: Typecheck application
        run: bun run typecheck

      - name: Typecheck Worker
        run: bun run worker:typecheck

      - name: Compile
        run: bun run compile
